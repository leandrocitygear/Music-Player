<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>disc=out</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body id="body">
    <div id="background">
      <div class="dark-overlay"></div>
    </div>
    <h1 class="logo">disc=out</h1>
    <div class="nowPlaying">
      <img class="albumArt" src="./b.jpg" alt="">
      <p class="artName"></p>
      <p class="albumName"></p>
      <p class="songName"></p>
      <div title="Favorite" class="likeButton">
        <img class="songIsFavorite" src="./icons/favorite.png"/>
      </div>
    </div>

    <div id="queue">
  <div id="queueOverlay"></div>

  <div id="queueHeader">
    <p>Queue</p>

    <button id="clearQueue">
      Clear
    </button>
  </div>

  <div id="queueList">

    <!-- <div class="queueSong">
      <img class="queueArt" src="" />

      <div class="queueSongInfo">
        <p class="queueSongTitle"></p>
        <p class="queueAlb"></p>
        <p class="queueArtistsName"></p>
      </div>

      <div class="queueSongDuration">
      </div>
    </div> -->

  </div>
</div>


      <div class="musicProgres">
        <audio id="myAudio">
          <source id="sourceAudio" src="" type="audio"/>
        </audio>

        <div class="player">
          <div class="timer"></div>
        <div class="title"></div>
        <div class="duration"></div>
        <div id="myProgress">
          <div id="myBar">
            <div id="progressHandle"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="musicControls">
      <div title="Menu" id="menu" class="icons">
    <img  src="./icons/menu.png" alt="">
  </div>

  <div id="repeat" title="Repeat" class="icons">
    <img  src="./icons/repeat.png" alt="">
  </div>

    <div id="shuffle" title="Shuffle" class="icons">
    <img  src="./icons/shuffle.png" alt="">
  </div>

  <div id="skip_previous" title="Provious" class="icons">
    <img  src="./icons/skip_previous.png" alt="">
  </div>

  <div id="play" title="Play" class="icons">
    <img  src="./icons/play.png" alt="">
  </div>

  <div id="skip_next" title="Next" class="icons">
    <img  src="./icons/skip_next.png" alt="">
  </div>

  <div id="fullscreen" title="Fullscreen" class="icons">
    <img  src="./icons/fullscreen.png" alt="">
  </div>

  <div id="volume" class="icons">
    <img src="./icons/volume.png" alt="">
    <input
        type="range"
        id="volumeSlider"
        min="0"
        max="1"
        step="0.01"
        value="1"
    >
  </div>
  </div>

  <div id="contextMenu" class="contextMenu"></div>

  <div id="settings" title="Add Music">
    <img src="./icons/add.png" alt="">
  </div>
  

  <div id="navigation">
    
      <div class="dark-overlay2"></div>
    
    <input id="search"/>
    <div id="searchButton" class="icons">
      <img src="./icons/search.png" alt="">
    </div>
   <div class="tabs">
    <div class="musicTabs" id="albums">ALBUMS</div>
    <div class="musicTabs" id="artists">ARTISTS</div>
    <div class="musicTabs" id="songs">SONGS</div>
    <div class="musicTabs" id="genres">GENRES</div>
    <div class="musicTabs" id="playlist">PLAYLIST</div>
  </div> 
  

  <div id="results">
    <!-- <div class="musicbox">
     <img id="art" src="./Parachutes.png" />
     <p id="title"></p>
     <p id="alb">Parachutes</p>
     <p id="artistsName">Coldplay</p>
    </div> -->
  </div>
  
  <div id="trackListContainer">
    <div id="trackListOverlay"></div>
    <div id="selectedAlbumContainer">
      <div id="selectedAlbum">
            <img id="selectedAlbumArt" src="" />
            <div id="selectedAlbumInfo">
              <p id="selectedAlbumName"></p>
              <p id="SelectedArtistsName"></p>
              <p></p>
              <p></p>
         </div>
          </div>
          <div id="songListContainer">
            <div class="songContainer">
              <div id="leftSpan">
                <img class="songStatusIcon" src="./icons/play.png" alt="">
              
                <p></p>
                <p></p>
              </div>
              <img src="./icons/favorite.png" alt="">
            </div>
            
          </div>
    </div>
  </div>
  
</div>

<!-- =========================
     CONTEXT MENU
========================= -->

<div id="contextMenu" class="contextMenu">

  <!-- SONG -->
  <div class="contextSection" data-menu="song">

    <button class="contextItem" data-action="play">
      <span>▶</span>
      <span>Play</span>
    </button>

    <button class="contextItem" data-action="play-next">
      <span>⏭</span>
      <span>Play Next</span>
    </button>

    <button class="contextItem" data-action="add-queue">
      <span>➕</span>
      <span>Add to Queue</span>
    </button>

    <div class="contextDivider"></div>

    <button class="contextItem" data-action="favorite">
      <span>❤️</span>
      <span class="favoriteText">
        Add to Favorites
      </span>
    </button>

    <div class="contextDivider"></div>

    <button class="contextItem" data-action="go-album">
      <span>📀</span>
      <span>Go to Album</span>
    </button>

    <button class="contextItem" data-action="go-artist">
      <span>👤</span>
      <span>Go to Artist</span>
    </button>

    <button class="contextItem" data-action="add-playlist">
      <span>➕</span>
      <span>Add to Playlist</span>
    </button>

    <button
      class="contextItem"
      data-action="remove-playlist"
      id="removeFromPlaylistItem"
    >
      <span>🗑</span>
      <span>Remove from Playlist</span>
    </button>

    <div class="contextDivider"></div>

    <button
      class="contextItem danger"
      data-action="delete-song"
    >
      <span>🗑</span>
      <span>Delete Song</span>
    </button>

  </div>


  <!-- ALBUM -->
  <div class="contextSection" data-menu="album">

    <button class="contextItem" data-action="play-album">
      <span>▶</span>
      <span>Play Album</span>
    </button>

    <button class="contextItem" data-action="album-next">
      <span>⏭</span>
      <span>Play Next</span>
    </button>

    <button class="contextItem" data-action="album-queue">
      <span>➕</span>
      <span>Add Album to Queue</span>
    </button>

    <div class="contextDivider"></div>

    <button class="contextItem" data-action="album-favorite">
      <span>❤️</span>
      <span class="albumFavoriteText">
        Add All to Favorites
      </span>
    </button>

    <button class="contextItem" data-action="album-artist">
      <span>👤</span>
      <span>Go to Artist</span>
    </button>

    <div class="contextDivider"></div>

    <button
      class="contextItem danger"
      data-action="delete-album"
    >
      <span>🗑</span>
      <span>Delete Album</span>
    </button>

  </div>


  <!-- ARTIST -->
  <div class="contextSection" data-menu="artist">

    <button class="contextItem" data-action="play-artist">
      <span>▶</span>
      <span>Play Artist</span>
    </button>

    <button class="contextItem" data-action="artist-queue">
      <span>➕</span>
      <span>Add Artist to Queue</span>
    </button>

  </div>


  <!-- PLAYLIST -->
  <div class="contextSection" data-menu="playlist">

    <button class="contextItem" data-action="play-playlist">
      <span>▶</span>
      <span>Play Playlist</span>
    </button>

    <button class="contextItem" data-action="playlist-next">
      <span>⏭</span>
      <span>Play Next</span>
    </button>

    <button class="contextItem" data-action="playlist-queue">
      <span>➕</span>
      <span>Add Playlist to Queue</span>
    </button>

    <div class="contextDivider"></div>

    <button class="contextItem" data-action="rename-playlist">
      <span>✏️</span>
      <span>Rename</span>
    </button>

    <button
      class="contextItem danger"
      data-action="delete-playlist"
    >
      <span>🗑</span>
      <span>Delete Playlist</span>
    </button>

  </div>

</div>

<div id="playlistPicker" class="playlistPicker">

  <div class="playlistPickerHeader">
    Add to Playlist
  </div>

  <div id="playlistPickerList"></div>

</div>

<script src="./render.js"></script>
</body>
</html>
