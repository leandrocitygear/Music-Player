name: Build Disc-Out

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:
    name: Build Windows Squirrel Installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Squirrel installer
        run: npm run make -- --platform=win32 --arch=x64
        env:
          DEBUG: electron-forge:*

      - name: Show Windows files
        shell: powershell
        run: |
          Write-Host "Windows build files:"
          Get-ChildItem -Path "out/make/squirrel.windows/x64" -Recurse

      - name: Prepare Windows release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release/windows"

          $exe = Get-ChildItem "out/make/squirrel.windows/x64/*.exe" | Select-Object -First 1

          if (-not $exe) {
            Write-Error "Windows installer EXE was not found."
            exit 1
          }

          Copy-Item $exe.FullName "release/windows/Disc-Out-Setup.exe"

          Write-Host "Windows release file:"
          Get-ChildItem "release/windows"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: disc-out-windows
          path: release/windows/Disc-Out-Setup.exe
          if-no-files-found: error


  # ============================================================
  # MACOS INTEL
  # ============================================================

  build-macos-intel:
    name: Build macOS Intel Installer
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set Python
        shell: bash
        run: |
          echo "PYTHON=$pythonLocation/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Electron 37 supports macOS 11 Big Sur
      - name: Install Big Sur compatible Electron
        run: |
          npm install electron@37.3.1 --save-exact

      - name: Rebuild better-sqlite3
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Rebuild DMG native dependencies
        run: |
          npm rebuild fs-xattr
          npm rebuild macos-alias
          npm rebuild ds-store

      - name: Verify native modules
        run: |
          ls -la node_modules/better-sqlite3/build/Release/
          ls -la node_modules/fs-xattr/build/Release/
          ls -la node_modules/macos-alias/build/Release/ || true
          ls -la node_modules/ds-store/build/Release/ || true

      - name: Verify Electron version
        run: |
          npx electron --version

      - name: Build macOS Intel installer
        run: npm run make -- --arch=x64

      - name: Show macOS files
        run: |
          echo "macOS build files:"
          find out/make -type f

      - name: Prepare macOS release
        shell: bash
        run: |
          mkdir -p release/macos

          DMG=$(find out/make -type f -name "*.dmg" | head -n 1)

          if [ -z "$DMG" ]; then
            echo "macOS DMG was not found."
            exit 1
          fi

          cp "$DMG" "release/macos/Disc-Out-macOS.dmg"

          echo "macOS release file:"
          ls -lh release/macos

      - name: Upload macOS installer
        uses: actions/upload-artifact@v5
        with:
          name: Disc-Out-macOS-Intel-Big-Sur
          path: release/macos/Disc-Out-macOS.dmg
          if-no-files-found: error


  # ============================================================
  # LINUX
  # ============================================================

  build-linux:
    name: Build Linux Installers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set Python
        shell: bash
        run: |
          echo "PYTHON=$pythonLocation/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build Linux installers
        run: npm run make

      - name: Show Linux files
        run: |
          echo "Linux build files:"
          find out/make -type f

      - name: Prepare Linux release
        shell: bash
        run: |
          mkdir -p release/linux

          DEB=$(find out/make -type f -name "*.deb" | head -n 1)
          RPM=$(find out/make -type f -name "*.rpm" | head -n 1)

          if [ -n "$DEB" ]; then
            cp "$DEB" "release/linux/Disc-Out-Ubuntu.deb"
          else
            echo "No .deb package found."
          fi

          if [ -n "$RPM" ]; then
            cp "$RPM" "release/linux/Disc-Out-Fedora.rpm"
          else
            echo "No .rpm package found."
          fi

          echo "Linux release files:"
          ls -lh release/linux

      - name: Upload Linux installers
        uses: actions/upload-artifact@v5
        with:
          name: Disc-Out-Linux-Installers
          path: release/linux/*
          if-no-files-found: error


  # ============================================================
  # CREATE GITHUB RELEASE
  # ============================================================

  release:
    name: Create GitHub Release

    needs:
      - build-windows
      - build-macos-intel
      - build-linux

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5

      # ----------------------------------------------------------
      # Get version from package.json
      # ----------------------------------------------------------

      - name: Get application version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "================================"
          echo "Disc-Out version: $VERSION"
          echo "================================"

      # ----------------------------------------------------------
      # Download Windows artifact
      # ----------------------------------------------------------

      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: disc-out-windows
          path: release/windows

      # ----------------------------------------------------------
      # Download macOS artifact
      # ----------------------------------------------------------

      - name: Download macOS installer
        uses: actions/download-artifact@v5
        with:
          name: Disc-Out-macOS-Intel-Big-Sur
          path: release/macos

      # ----------------------------------------------------------
      # Download Linux artifacts
      # ----------------------------------------------------------

      - name: Download Linux installers
        uses: actions/download-artifact@v5
        with:
          name: Disc-Out-Linux-Installers
          path: release/linux

      # ----------------------------------------------------------
      # Show everything going into the release
      # ----------------------------------------------------------

      - name: Show release files
        shell: bash
        run: |
          echo "================================"
          echo "FILES FOR GITHUB RELEASE"
          echo "================================"

          find release -type f -exec ls -lh {} \;

      # ----------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "v$VERSION" \
            release/windows/Disc-Out-Setup.exe \
            release/macos/Disc-Out-macOS.dmg \
            release/linux/* \
            --title "Disc-Out v$VERSION" \
            --generate-notes