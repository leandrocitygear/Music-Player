name: Build Disc-Out

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure npm Python
        shell: pwsh
        run: |
          npm config set python "${{ env.pythonLocation }}\python.exe"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run make

      - name: Upload Windows build
        uses: actions/upload-artifact@v5
        with:
          name: Disc-Out-Windows
          path: out/make/**
          if-no-files-found: error


  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure npm Python
        run: npm config set python "${pythonLocation}/python"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installer
        run: npm run make

      - name: Upload macOS build
        uses: actions/upload-artifact@v5
        with:
          name: Disc-Out-macOS
          path: out/make/**
          if-no-files-found: error