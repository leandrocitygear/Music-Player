name: Build Disc-Out

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set Python
      shell: pwsh
      run: |
        "PYTHON=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Rebuild better-sqlite3
      run: npx electron-rebuild -f -w better-sqlite3

    - name: Build Windows installer
      run: npm run make

    - name: Upload Windows installer
      uses: actions/upload-artifact@v5
      with:
        name: Disc-Out-Windows-Installer
        path: out/make/**
        if-no-files-found: error


  build-macos-intel:
    name: Build macOS Intel Installer
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set Python
        shell: bash
        run: |
          echo "PYTHON=$pythonLocation/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Rebuild macOS DMG dependencies
        run: npm rebuild macos-alias ds-store

      - name: Build macOS Intel installer
        run: npm run make -- --arch=x64

      - name: Upload macOS Intel installer
        uses: actions/upload-artifact@v5
        with:
          name: Disc-Out-macOS-Intel-Installer
          path: out/make/**
          if-no-files-found: error